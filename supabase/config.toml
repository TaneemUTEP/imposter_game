project_id = "imposter"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
enable_anonymous_sign_ins = true
site_url = "https://impostergame-eight-navy.vercel.app"
additional_redirect_urls = ["http://localhost:8081", "https://impostergame-eight-navy.vercel.app"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
